<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EpiSpace Streaming QA Viewer</title>
<style>
:root{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--line:#dde3ec;--text:#182033;--muted:#687386;--blue:#245eea;--blue2:#eaf0ff;--green:#18794e;--green2:#e8f6ef;--purple:#7545c7;--amber:#9a6510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{height:62px;padding:11px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}h1{font-size:17px;margin:0 0 4px}.muted{color:var(--muted)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--line);background:#fff;padding:14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 9px;color:var(--text)}input{width:100%;margin-bottom:8px}select{width:100%;margin-bottom:10px}button{cursor:pointer}button:hover{border-color:var(--blue);color:var(--blue)}
.record{border:1px solid var(--line);border-radius:8px;padding:9px;margin:7px 0;cursor:pointer}.record:hover,.record.active{border-color:var(--blue);background:var(--blue2)}.record-id{font-size:11px;font-weight:700;overflow-wrap:anywhere}.record-meta{font-size:10px;color:var(--muted);margin-top:4px}.caps{font-size:10px;color:var(--purple);margin-top:4px;overflow-wrap:anywhere}
main{padding:18px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:14px}.headline{display:flex;justify-content:space-between;gap:10px;align-items:start}.headline h2{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;border-radius:999px;background:#eef1f5;color:#536075;padding:3px 7px}.chip.blue{background:var(--blue2);color:var(--blue)}.chip.green{background:var(--green2);color:var(--green)}
.player{display:grid;grid-template-columns:minmax(420px,1.25fr) minmax(360px,1fr);gap:14px;margin-top:13px}.stage{height:min(57vh,610px);background:#10151e;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:5px 8px;font:11px ui-monospace,monospace}
.questions h3{font-size:14px;margin:0 0 9px}.question{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px}.qhead{display:flex;justify-content:space-between;gap:8px;font-size:11px}.qtext{white-space:pre-wrap;line-height:1.55;margin:8px 0}.options{display:flex;gap:5px;flex-wrap:wrap}.option{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 6px}.option.gold{border-color:var(--green);background:var(--green2);color:var(--green);font-weight:700}.answer{font-size:17px;font-weight:800;color:var(--green)}details{margin-top:8px;font-size:11px}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7f9;padding:8px;border-radius:6px;max-height:260px;overflow:auto}
.event-controls{display:flex;gap:7px;align-items:center;margin:12px 0}.event-controls .position{font-size:12px;color:var(--muted)}.timeline{display:flex;gap:6px;overflow:auto;padding:6px 1px 10px}.frame{flex:0 0 105px;border:2px solid transparent;background:#f4f6f9;border-radius:8px;padding:3px;cursor:pointer;position:relative}.frame.current{border-color:var(--blue)}.frame.future{opacity:.35;cursor:not-allowed}.frame.future img{filter:blur(8px)}.frame.query:after{content:attr(data-q);position:absolute;right:5px;top:5px;color:#fff;background:var(--purple);border-radius:999px;padding:2px 6px;font-size:9px}.frame img{display:block;width:95px;height:70px;object-fit:cover;border-radius:4px}.frame div{font-size:9px;color:var(--muted);margin-top:3px}.history-title{font-weight:700;margin:3px 0 8px}.turn-table{width:100%;border-collapse:collapse;font-size:11px}.turn-table th,.turn-table td{border-bottom:1px solid #edf0f4;padding:6px;text-align:left}.turn-table tr.active{background:var(--blue2)}.turn-table tr{cursor:pointer}.error{padding:18px;background:#feeceb;color:#a51d16;border-radius:8px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:280px;border-right:0;border-bottom:1px solid var(--line)}.player{grid-template-columns:1fr}.stage{height:48vh}}
</style>
</head>
<body>
<header><h1>Streaming QA · Episode-first Viewer</h1><div class="muted" id="summary">正在加载…</div></header>
<div class="layout">
  <aside><input id="search" placeholder="搜索 episode / plan / capability"><select id="cap-filter"><option value="">全部 capability</option></select><div class="muted" id="filter-count"></div><div id="records"></div></aside>
  <main id="main"><div class="panel">从左侧选择一条 episode。</div></main>
</div>
<script>
const S={index:null,rows:[],record:null,event:0,frame:0};
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const sourceURL=path=>new URL(`../source/${path}`,location.href).href;
function eventGroups(){const m=new Map;for(const t of S.record.turns){if(!m.has(t.prefix_length))m.set(t.prefix_length,[]);m.get(t.prefix_length).push(t)}return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([prefix,turns])=>({prefix,turns}));}
function renderList(){const q=document.getElementById('search').value.toLowerCase(),cap=document.getElementById('cap-filter').value;S.rows=S.index.records.filter(r=>(!cap||r.capabilities.includes(cap))&&(!q||`${r.episode_id} ${r.plan_id} ${r.capabilities.join(' ')} ${r.temporal_mode}`.toLowerCase().includes(q)));document.getElementById('filter-count').textContent=`显示 ${S.rows.length}/${S.index.record_count}`;document.getElementById('records').innerHTML=S.rows.map(r=>`<div class="record ${S.record?.record_id===r.record_id?'active':''}" data-id="${esc(r.record_id)}"><div class="record-id">${esc(r.episode_id)}</div><div class="record-meta">${r.frame_count} frames · ${r.turn_count} turns · ${esc(r.tier)} · ${esc(r.temporal_mode)}</div><div class="caps">${esc(r.capabilities.join(' · '))}</div></div>`).join('');document.querySelectorAll('.record').forEach(x=>x.onclick=()=>loadRecord(x.dataset.id));}
async function loadRecord(id){const meta=S.index.records.find(x=>x.record_id===id);S.record=await(await fetch(meta.path)).json();S.event=0;S.frame=eventGroups()[0].prefix-1;renderList();renderMain();}
function setEvent(i){const e=eventGroups();S.event=Math.max(0,Math.min(i,e.length-1));S.frame=e[S.event].prefix-1;renderMain();}
function turnCard(t){const cert=t.certificate||{},w=cert.answer?.witness||{};return `<section class="question"><div class="qhead"><b>${esc(t.capability)}</b><span><span class="chip green">${esc(t.status)}</span> t_q=${esc(cert.frame_vars?.t_q)}</span></div><div class="qtext">${esc(t.question)}</div><div class="options">${t.choices.map(x=>`<span class="option ${x===t.answer?'gold':''}">${esc(x)}</span>`).join('')}</div><div style="margin-top:8px">Gold: <span class="answer">${esc(t.answer)}</span></div><div class="muted" style="font-size:10px;margin-top:4px">witness: ${esc(JSON.stringify(w))}</div><details><summary>展开 authority certificate</summary><pre>${esc(JSON.stringify(cert,null,2))}</pre></details></section>`;}
function renderMain(){const r=S.record,e=eventGroups(),cur=e[S.event],available=r.images.filter(x=>x.ordinal<cur.prefix),img=r.images.find(x=>x.ordinal===S.frame)||available.at(-1);const countAt=Object.fromEntries(e.map(x=>[x.prefix,x.turns.length]));document.getElementById('main').innerHTML=`<section class="panel"><div class="headline"><div><h2>${esc(r.episode_id)}</h2><div class="muted">${esc(r.source.plan_id)} · scene ${esc(r.source.scene_id)}</div></div><div class="chips"><span class="chip blue">${esc(r.tier)}</span><span class="chip">${esc(r.stream_kind)}</span><span class="chip">${esc(r.temporal_mode)}</span><span class="chip green">${r.turns.length} turns</span></div></div><div class="event-controls"><button id="prev-event">上一个提问时刻</button><button id="next-event">下一个提问时刻</button><span class="position">事件 ${S.event+1}/${e.length} · prefix=${cur.prefix} · sequence t_q=${cur.prefix-1} · 当前 ${cur.turns.length} 问</span></div><div class="player"><div class="stage"><img src="${sourceURL(img.path)}"><span class="badge">sequence ${img.ordinal} · source frame ${img.source_frame} · 当前可见前缀 [0…${cur.prefix-1}]</span></div><div class="questions"><h3>这个 t_q 上提出的问题</h3>${cur.turns.map(turnCard).join('')}</div></div><div class="timeline">${r.images.map(x=>`<div class="frame ${x.ordinal===S.frame?'current ':''}${x.ordinal>=cur.prefix?'future ':''}${countAt[x.ordinal+1]?'query':''}" data-frame="${x.ordinal}" data-q="${countAt[x.ordinal+1]||''}"><img loading="lazy" src="${sourceURL(x.path)}"><div>seq ${x.ordinal} · src ${x.source_frame}${countAt[x.ordinal+1]?` · ${countAt[x.ordinal+1]}问`:''}</div></div>`).join('')}</div></section><section class="panel"><div class="history-title">这条 episode 的完整 streaming 问答序列</div><table class="turn-table"><thead><tr><th>#</th><th>prefix / t_q</th><th>capability</th><th>status</th><th>gold</th></tr></thead><tbody>${r.turns.map((t,i)=>`<tr class="${t.prefix_length===cur.prefix?'active':''}" data-prefix="${t.prefix_length}"><td>${i+1}</td><td>${t.prefix_length} / ${t.prefix_length-1}</td><td>${esc(t.capability)}</td><td>${esc(t.status)}</td><td><b>${esc(t.answer)}</b></td></tr>`).join('')}</tbody></table></section>`;document.getElementById('prev-event').onclick=()=>setEvent(S.event-1);document.getElementById('next-event').onclick=()=>setEvent(S.event+1);document.querySelectorAll('.frame:not(.future)').forEach(x=>x.onclick=()=>{S.frame=Number(x.dataset.frame);renderMain()});document.querySelectorAll('.turn-table tbody tr').forEach(x=>x.onclick=()=>{const p=Number(x.dataset.prefix);setEvent(e.findIndex(v=>v.prefix===p))});}
async function init(){S.index=await(await fetch('data/index.json')).json();document.getElementById('summary').textContent=`${S.index.source_collection_id} · ${S.index.record_count} episodes · ${S.index.turn_count} turns`;const caps=[...new Set(S.index.records.flatMap(x=>x.capabilities))].sort();document.getElementById('cap-filter').innerHTML+=[...caps].map(x=>`<option>${esc(x)}</option>`).join('');document.getElementById('search').oninput=renderList;document.getElementById('cap-filter').onchange=renderList;renderList();if(S.index.records.length)loadRecord(S.index.records[0].record_id);}
init().catch(e=>document.getElementById('main').innerHTML=`<div class="error">${esc(e.stack||e)}</div>`);
</script>
</body></html>
