name: CI

on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make check
      - run: make test
      - run: make doctor
