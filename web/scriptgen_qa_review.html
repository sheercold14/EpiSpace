<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scriptgen QA Review</title>
  <style>
    :root{--bg:#f3f2ed;--panel:#fff;--ink:#20211f;--muted:#6a6e68;--line:#d9dbd4;--accent:#315d57;--warn:#92552b;--bad:#913b3b;--good:#2f6b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Noto Sans SC",sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(243,242,237,.96);border-bottom:1px solid var(--line);padding:16px 22px}.head{display:flex;align-items:end;justify-content:space-between;gap:16px}.title{font-size:21px;font-weight:720}.stats{display:flex;gap:14px;color:var(--muted)}.stats b{color:var(--ink)}.links a{color:var(--accent);margin-left:12px}.filters{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr)) 1.5fr;gap:8px;margin-top:14px}select,input{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px;color:var(--ink)}main{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:calc(100vh - 112px)}aside{border-right:1px solid var(--line);overflow:auto;height:calc(100vh - 112px);position:sticky;top:112px}.row{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent}.row:hover,.row.active{background:#fff}.rowtop{display:flex;justify-content:space-between;gap:8px}.rid{font:12px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{font-size:11px;padding:2px 6px;border-radius:999px;background:#e5e7e1;color:#4e534e}.chip.eligible{background:#dcecdf;color:var(--good)}.chip.valid-hard{background:#f1e5d3;color:var(--warn)}.chip.shortcut-risk,.chip.protocol-failure{background:#f2dada;color:var(--bad)}section#detail{padding:22px;overflow:hidden}.empty{color:var(--muted);padding:80px 20px;text-align:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.meta div{min-width:0}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.value{overflow-wrap:anywhere}.question{font-size:16px;white-space:pre-wrap}.answer{font:700 15px ui-monospace,monospace;color:var(--accent)}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-top:12px}.frame{position:relative;background:#191a18;border-radius:7px;overflow:hidden;min-height:90px}.frame img{display:block;width:100%;height:150px;object-fit:cover}.frame span{position:absolute;left:6px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;padding:2px 5px;font-size:11px}.preds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.pred{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}.pred.good{border-color:#90b69a}.pred.bad{border-color:#d5a3a3}.pred h4{margin:0 0 6px;font-size:12px}.response{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#444}.turn{border-left:3px solid var(--accent);padding-left:14px;margin:18px 0 24px}.turn h3{margin:0 0 8px}.count{padding:8px 14px;color:var(--muted);border-bottom:1px solid var(--line)}@media(max-width:900px){header{position:static}.filters{grid-template-columns:repeat(2,1fr)}main{display:block}aside{position:static;height:260px;border-right:0;border-bottom:1px solid var(--line)}.meta{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header>
  <div class="head"><div><div class="title">Scriptgen Raw / Streaming QA</div><div id="updated" class="label">loading</div></div><div class="stats" id="stats"></div><div class="links"><a href="research_report.md">研究审计</a><a href="manifest.json">manifest</a></div></div>
  <div class="filters">
    <select id="type"><option value="">全部格式</option></select><select id="batch"><option value="">全部批次</option></select><select id="tier"><option value="">全部层级</option></select><select id="cap"><option value="">全部题型</option></select><select id="variant"><option value="">全部变体</option></select><select id="klass"><option value="">全部分类</option></select><input id="search" placeholder="record / scene / capability">
  </div>
</header>
<main><aside><div class="count" id="count"></div><div id="list"></div></aside><section id="detail"><div class="empty">选择一条数据进行 review</div></section></main>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null, rows=[], selected=null, signature='';
const filterIds=['type','batch','tier','cap','variant','klass','search'];
function uniq(values){return [...new Set(values.filter(Boolean))].sort()}
function fill(id,values,label){const e=$(id),old=e.value;e.innerHTML=`<option value="">全部${label}</option>`+values.map(v=>`<option>${esc(v)}</option>`).join('');e.value=values.includes(old)?old:''}
function configure(){fill('type',uniq(rows.map(r=>r.sample_type)),'格式');fill('batch',uniq(rows.map(r=>r.batch_id)),'批次');fill('tier',uniq(rows.map(r=>r.tier)),'层级');fill('cap',uniq(rows.flatMap(r=>r.capabilities)),'题型');fill('variant',uniq(rows.map(r=>r.variant)),'变体');fill('klass',uniq(rows.map(r=>r.review_class)),'分类')}
function filtered(){const q=$('search').value.trim().toLowerCase();return rows.filter(r=>(!$('type').value||r.sample_type===$('type').value)&&(!$('batch').value||r.batch_id===$('batch').value)&&(!$('tier').value||r.tier===$('tier').value)&&(!$('cap').value||r.capabilities.includes($('cap').value))&&(!$('variant').value||r.variant===$('variant').value)&&(!$('klass').value||r.review_class===$('klass').value)&&(!q||JSON.stringify([r.record_id,r.cluster_ids,...r.capabilities]).toLowerCase().includes(q)))}
function chips(r){return [r.sample_type,r.tier,...r.capabilities,r.variant,r.review_class].filter(Boolean).map(v=>`<span class="chip ${esc(v)}">${esc(v)}</span>`).join('')}
function renderList(){const f=filtered();$('count').textContent=`${f.length} / ${rows.length}`;$('list').innerHTML=f.map(r=>`<div class="row ${r.record_id===selected?'active':''}" data-id="${esc(r.record_id)}"><div class="rowtop"><span class="rid">${esc(r.record_id)}</span><span>${esc(r.batch_id)}</span></div><div class="chips">${chips(r)}</div></div>`).join('');document.querySelectorAll('.row').forEach(e=>e.onclick=()=>{selected=e.dataset.id;renderList();renderDetail()});if(selected&&!f.some(r=>r.record_id===selected)){selected=null;$('detail').innerHTML='<div class="empty">当前筛选下没有已选记录</div>'}}
function imageGrid(images){if(!images?.length)return '<div class="label">本轮无新增图像</div>';return `<div class="images">${images.map(i=>`<div class="frame"><img loading="lazy" src="source/${esc(i.path)}"><span>#${i.ordinal} · frame ${i.source_frame}</span></div>`).join('')}</div>`}
function predCards(predictions,turnId){return `<div class="preds">${Object.entries(predictions||{}).map(([name,p])=>{let t=turnId?(p.turns||[]).find(x=>x.turn_id===turnId):p;let ok=t?.correct;return `<div class="pred ${ok?'good':'bad'}"><h4>${esc(name)} · semantic ${ok?'✓':'✗'} · format ${t?.format_compliant?'✓':'✗'} · pred=${esc(t?.prediction)}</h4><div class="response">${esc(t?.response||p.error||'')}</div></div>`}).join('')}</div>`}
function meta(r){return `<div class="card meta"><div><div class="label">record</div><div class="value">${esc(r.record_id)}</div></div><div><div class="label">scene</div><div class="value">${esc(r.cluster_ids.scene)}</div></div><div><div class="label">trajectory</div><div class="value">${esc(r.cluster_ids.trajectory)}</div></div><div><div class="label">classification</div><div class="value">${esc(r.review_class)} · ${esc(r.review_reason)}</div></div></div>`}
function renderRaw(r){return meta(r)+`<div class="card"><div class="question">${esc(r.input.question)}</div><div class="answer">gold: ${esc(r.oracle.answer.label)}</div>${imageGrid(r.input.images)}</div><div class="card"><div class="label">SenseNova</div>${predCards(r.predictions)}</div>`}
function renderStream(r){const oracle=Object.fromEntries(r.oracle.turns.map(t=>[t.turn_id,t]));return meta(r)+`<div class="card"><div class="label">${esc(r.input.stream_kind)} · ${r.input.turns.length} turns</div>${r.input.turns.map((t,i)=>`<div class="turn"><h3>Turn ${i+1} · prefix ${t.prefix_length} · ${esc(t.capability)}</h3>${imageGrid(t.new_images)}<div class="question">${esc(t.question)}</div><div class="answer">gold: ${esc(oracle[t.turn_id]?.answer)} · ${esc(oracle[t.turn_id]?.status)}</div>${predCards(r.predictions,t.turn_id)}</div>`).join('')}</div>`}
function renderDetail(){const r=rows.find(x=>x.record_id===selected);$('detail').innerHTML=!r?'<div class="empty">选择一条数据进行 review</div>':(r.sample_type==='raw_qa'?renderRaw(r):renderStream(r))}
async function load(){try{const res=await fetch(`review.json?t=${Date.now()}`,{cache:'no-cache'});const next=await res.json();const sig=`${next.rows.length}:${JSON.stringify(next.case_counts)}:${next.source_integrity.status}:${next.prediction_snapshot_sha256}`;if(sig===signature)return;signature=sig;data=next;rows=next.rows;const old=selected;configure();selected=rows.some(r=>r.record_id===old)?old:null;$('stats').innerHTML=`<span><b>${next.manifest.raw_record_count}</b> raw</span><span><b>${next.manifest.streaming_record_count}</b> streaming</span><span><b>${next.manifest.streaming_turn_count}</b> turns</span><span><b>${esc(next.source_integrity.status)}</b> source</span>`;$('updated').textContent=`更新 ${new Date().toLocaleTimeString()} · ${JSON.stringify(next.case_counts)}`;renderList();renderDetail()}catch(e){$('updated').textContent=`读取失败：${e}`}}
filterIds.forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderList));load();setInterval(load,5000);
</script>
</body>
</html>
