<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Scriptgen 轨迹审核</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f6f8; color: #1c1e21; }
  header { background: #fff; border-bottom: 1px solid #e0e2e6; padding: 14px 24px; }
  header h1 { margin: 0 0 4px; font-size: 17px; }
  header .meta { color: #5a5e66; font-size: 13px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 24px 60px; }
  section { background: #fff; border: 1px solid #e0e2e6; border-radius: 8px;
            margin-top: 18px; padding: 16px 20px; }
  section h2 { margin: 0 0 12px; font-size: 15px; }
  .film-scroll { overflow-x: auto; padding-bottom: 6px; }
  .film-row { display: flex; gap: 10px; margin-bottom: 6px; align-items: center; }
  .row-label { flex: 0 0 44px; font-size: 12px; color: #5a5e66; text-align: right;
               padding-right: 4px; }
  .cell { flex: 0 0 168px; text-align: center; font-size: 12px; }
  .cell img { width: 168px; height: 168px; object-fit: cover; border-radius: 4px;
              border: 3px solid transparent; cursor: zoom-in; display: block; }
  .cell.seen img { border-color: #2266dd; }
  .cell.query img { border-color: #9933cc; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 9px; margin-top: 3px; }
  .tag.visible { background: #d9f0dc; color: #1d7a2c; }
  .tag.invisible { background: #ececf0; color: #666; }
  .tag.ambiguous { background: #fdeccc; color: #b06000; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #eceef1; padding: 6px 10px; text-align: left;
           vertical-align: top; }
  th { color: #5a5e66; font-weight: 600; background: #fafbfc; }
  td.num { font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: #2266dd; }
  pre { margin: 6px 0 0; background: #f6f8fa; border-radius: 6px; padding: 8px 10px;
        font-size: 12px; overflow-x: auto; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .answer { font-size: 14px; line-height: 1.8; }
  .answer b.gold { color: #1d7a2c; font-size: 16px; }
  svg text { font-size: 10px; fill: #444; }
  .legend { font-size: 12px; color: #5a5e66; margin-top: 6px; }
  .legend span { margin-right: 16px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px;
         vertical-align: -1px; margin-right: 4px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none;
              align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 92vw; max-height: 92vh; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<div class="wrap">

<section>
  <h2>俯视轨迹图</h2>
  <div id="map"></div>
  <div class="legend">
    <span><span class="dot" style="background:#d33"></span>目标物</span>
    <span><span class="dot" style="background:#8ab"></span>其他物体</span>
    <span><span class="dot" style="background:#bbb"></span>墙体/遮挡</span>
    <span><span class="dot" style="background:#2266dd"></span>t_seen 帧</span>
    <span><span class="dot" style="background:#9933cc"></span>提问帧 t_q</span>
    <span>箭头 = 相机位置与朝向,数字 = 帧号</span>
  </div>
</section>

<section>
  <h2>帧序(蓝框 = 最后可见帧 t_seen,紫框 = 提问帧 t_q;标签为目标物在渲染掩码中的像素数;实例行中目标物为亮红色)</h2>
  <div class="film-scroll" id="film"></div>
</section>

<section>
  <h2>题目与标准答案</h2>
  <div class="answer" id="answer"></div>
</section>

<div class="two-col">
<section>
  <h2>剧本条款与核验见证</h2>
  <table id="clauses"><thead>
    <tr><th>条款</th><th>谓词</th><th>阶段</th><th>见证</th></tr>
  </thead><tbody></tbody></table>
</section>

<section>
  <h2>编译标准(<span id="stdver"></span>)</h2>
  <table id="standards"><tbody></tbody></table>
</section>
</div>

</div>
<div id="lightbox"><img id="lightbox-img"></div>

<script>
async function main() {
  const d = await (await fetch("data.json")).json();

  document.getElementById("title").textContent = d.title;
  document.getElementById("meta").textContent =
    `场景 ${d.scene_id} · 能力 ${d.capability} · 标准 ${d.standard_version}` +
    ` · 目标物 ${d.target.category} · ${d.frames.length} 帧`;

  drawMap(d);
  drawFilm(d);
  drawAnswer(d);
  drawClauses(d);
  drawStandards(d);
}

function drawMap(d) {
  const poses = d.plan.poses;
  const pts = poses.map(p => [p.x, p.y])
    .concat(d.layout.objects.map(o => o.xy))
    .concat([d.target.xy]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 1.2;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const W = 860, H = Math.min(620, W * (maxY - minY) / (maxX - minX));
  const sx = W / (maxX - minX), sy = H / (maxY - minY), s = Math.min(sx, sy);
  const X = x => (x - minX) * s;
  const Y = y => H - (y - minY) * s;   // y 轴向上为正

  let svg = `<svg width="${W}" height="${H}" style="background:#fcfcfd;border:1px solid #eceef1;border-radius:6px">`;

  for (const [mn, mx] of d.layout.occluders) {
    const ix0 = Math.max(mn[0], minX), iy0 = Math.max(mn[1], minY);
    const ix1 = Math.min(mx[0], maxX), iy1 = Math.min(mx[1], maxY);
    if (ix0 >= ix1 || iy0 >= iy1) continue;
    svg += `<rect x="${X(ix0)}" y="${Y(iy1)}" width="${(ix1-ix0)*s}" height="${(iy1-iy0)*s}"
            fill="#ccc" opacity="0.7"/>`;
  }
  for (const o of d.layout.objects) {
    const r = Math.max(o.size_m * s / 2, 3);
    const color = o.is_target ? "#d33" : "#8ab";
    svg += `<circle cx="${X(o.xy[0])}" cy="${Y(o.xy[1])}" r="${r}" fill="${color}" opacity="0.55">
            <title>${o.category}</title></circle>`;
    if (o.is_target)
      svg += `<text x="${X(o.xy[0])+r+2}" y="${Y(o.xy[1])+3}" fill="#a22">${o.category}</text>`;
  }
  // 轨迹连线
  const path = poses.map((p,i) => `${i?"L":"M"}${X(p.x)},${Y(p.y)}`).join(" ");
  svg += `<path d="${path}" stroke="#666" fill="none" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  // 逐帧箭头
  for (const p of poses) {
    const isSeen = d.frames[p.frame].is_t_seen, isQ = d.frames[p.frame].is_t_q;
    const color = isSeen ? "#2266dd" : isQ ? "#9933cc" : "#444";
    const a = p.yaw_deg * Math.PI / 180, L = 14;
    const x0 = X(p.x), y0 = Y(p.y);
    const x1 = x0 + L * Math.cos(a), y1 = y0 - L * Math.sin(a);
    svg += `<circle cx="${x0}" cy="${y0}" r="${isSeen||isQ?5:3.2}" fill="${color}"/>`;
    svg += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${color}" stroke-width="2"/>`;
    svg += `<text x="${x0+5}" y="${y0-5}">${p.frame}</text>`;
  }
  svg += `</svg>`;
  document.getElementById("map").innerHTML = svg;
}

function drawFilm(d) {
  const film = document.getElementById("film");
  const zhTag = { visible: "可见", invisible: "不可见", ambiguous: "模糊" };
  const rows = [["RGB", "rgb"], ["深度", "depth"], ["实例", "instance"]];

  // 顶部信息行:帧号 + 像素标签
  const head = document.createElement("div");
  head.className = "film-row";
  head.innerHTML = `<div class="row-label"></div>` + d.frames.map(f => {
    const mark = f.is_t_seen ? " · t_seen" : f.is_t_q ? " · t_q" : "";
    return `<div class="cell"><div>帧 ${f.frame}${mark}</div>
      <span class="tag ${f.tristate}">${zhTag[f.tristate]} ${f.target_pixels}px</span></div>`;
  }).join("");
  film.appendChild(head);

  for (const [label, key] of rows) {
    const row = document.createElement("div");
    row.className = "film-row";
    row.innerHTML = `<div class="row-label">${label}</div>` + d.frames.map(f => {
      const cls = "cell" + (f.is_t_seen ? " seen" : "") + (f.is_t_q ? " query" : "");
      return `<div class="${cls}"><img src="${f[key]}" loading="lazy" data-full="${f[key]}"></div>`;
    }).join("");
    film.appendChild(row);
  }

  film.addEventListener("click", event => {
    const full = event.target.dataset && event.target.dataset.full;
    if (!full) return;
    document.getElementById("lightbox-img").src = full;
    document.getElementById("lightbox").style.display = "flex";
  });
  document.getElementById("lightbox").onclick = () =>
    document.getElementById("lightbox").style.display = "none";
}

function drawAnswer(d) {
  const q = d.question;
  document.getElementById("answer").innerHTML =
    `<div>${q.text}</div>
     <div>选项:${q.options.join(" / ")}</div>
     <div>标准答案:<b class="gold">${q.gold}</b>
       (方位角 ${q.azimuth_deg}°,距扇区边界裕度 ${q.margin_deg}°;
       该答案为几何推导的临时值,渲后位姿重算一致)</div>`;
}

function drawClauses(d) {
  const tbody = document.querySelector("#clauses tbody");
  for (const c of d.script.clauses) {
    const witness = d.plan.clause_witnesses[c.name];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${c.name}</td><td>${c.predicate}</td><td>${c.phase}</td>
      <td><details><summary>展开</summary><pre>${
        JSON.stringify(witness ?? "(无)", null, 1)}</pre></details></td>`;
    tbody.appendChild(tr);
  }
}

function drawStandards(d) {
  document.getElementById("stdver").textContent = d.standards.standard_version;
  const tbody = document.querySelector("#standards tbody");
  for (const [k, v] of Object.entries(d.standards)) {
    if (k === "standard_version") continue;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${k}</td><td class="num">${v}</td>`;
    tbody.appendChild(tr);
  }
}

main();
</script>
</body>
</html>
