[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigibson-spatial-episode"
version = "0.1.0"
description = "OmniGibson acquisition backend for simulator-independent spatial episodes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
og-episode = "omnigibson_episode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnigibson_episode = ["templates/*.html", "templates/*.css", "templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../habitat/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
